[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yit-player"
version = "3.1.0"
description = "Fire-and-Forget Music CLI that learns your taste"
readme = "README.md"
authors = [{name = "Yit Team"}]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    # YouTube now needs a JS runtime to solve stream challenges; yt-dlp auto-detects deno.
    "deno>=2; platform_machine == 'AMD64' or platform_machine == 'x86_64' or platform_machine == 'arm64' or platform_machine == 'aarch64'",
    "requests",
    "mcp>=1.2"
]

[project.urls]
"Homepage" = "https://github.com/VijayarajParamasivam/yit"
"Bug Tracker" = "https://github.com/VijayarajParamasivam/yit/issues"

[project.scripts]
yit = "yit:main"
yit-mcp = "yit.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yit"]
